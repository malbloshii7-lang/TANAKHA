<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reading the Sky</title>
<meta name="description" content="A short film for the 20th anniversary of the UAE National Center of Meteorology, rendered live on a canvas. The MP4 in this folder is the same film, frame for frame, with its score." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400&family=Cinzel:wght@700;900&family=IBM+Plex+Mono:wght@500;600&family=IM+Fell+English:ital@1&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet" />
<style>
  html,body{margin:0;height:100%;background:#14110e}
  body{display:grid;place-items:center;overflow:hidden}
  canvas{display:block;width:min(100vw,calc(100vh * 16 / 9));height:auto;aspect-ratio:16/9}
</style>
</head>
<body>
<canvas id="film" width="1920" height="1080" aria-label="Reading the Sky: a film for the 20th anniversary of the National Center of Meteorology"></canvas>
<script>
'use strict';
/* ==========================================================================
   Reading the Sky — a film for NCM's 20th anniversary.
   Everything is a pure function of time: render(t) draws frame t, so the same
   code plays live in a browser and renders frame-exact for the MP4
   (see render.js). Open with ?capture to expose window.__render for capture,
   or ?t=SECONDS to jump.
   ========================================================================== */
const W = 1920, H = 1080, TAU = Math.PI * 2;
const INK = '#1D1813', RED = '#B3391D', BLUE = '#28478C', OCHRE = '#C9973B', SEPIA = '#6E6253';
const cv = document.getElementById('film');
let ctx = cv.getContext('2d'); // helpers draw on ctx; during a crossfade it points at LAYER
const MAIN = ctx;
let LAYER_CV, LAYER;
let SA = 1; // opacity multiplier for scene drawing (1 in normal use; crossfades composite a whole layer instead)
let REAL_LT = 0; // unscaled local time of the scene being drawn (labels switch on real cuts)

/* ---------- maths & motion ---------- */
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const prog = (t, start, dur) => clamp((t - start) / dur);
function rng(seed) {
  let s = (Math.imul(seed | 0, 2654435761) >>> 0) || 1;
  return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
}
function wobble(seed, amp) {
  const r = rng(seed), p1 = r() * TAU, p2 = r() * TAU, p3 = r() * TAU;
  const f1 = 0.012 + r() * 0.006, f2 = 0.03 + r() * 0.01, f3 = 0.07 + r() * 0.02;
  return s => amp * (Math.sin(s * f1 + p1) * 0.55 + Math.sin(s * f2 + p2) * 0.3 + Math.sin(s * f3 + p3) * 0.15);
}

/* ---------- paths: hand-inked polylines that can be drawn on ---------- */
class P {
  constructor(pts, closed = false) {
    this.pts = pts; this.closed = closed;
    const L = [0]; let acc = 0;
    for (let i = 1; i < pts.length; i++) { acc += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); L.push(acc); }
    this.open = acc;
    if (closed && pts.length > 1) acc += Math.hypot(pts[0][0] - pts[pts.length - 1][0], pts[0][1] - pts[pts.length - 1][1]);
    this.L = L; this.total = acc;
  }
  trace(c, p = 1) {
    const pts = this.pts, n = pts.length;
    if (p <= 0 || n < 2) return;
    const target = this.total * Math.min(1, p);
    c.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < n; i++) {
      if (this.L[i] <= target) { c.lineTo(pts[i][0], pts[i][1]); continue; }
      const f = (target - this.L[i - 1]) / (this.L[i] - this.L[i - 1] || 1);
      c.lineTo(lerp(pts[i - 1][0], pts[i][0], f), lerp(pts[i - 1][1], pts[i][1], f));
      return;
    }
    if (!this.closed) return;
    if (p >= 1) { c.closePath(); return; }
    const last = pts[n - 1], f = (target - this.open) / (this.total - this.open || 1);
    c.lineTo(lerp(last[0], pts[0][0], f), lerp(last[1], pts[0][1], f));
  }
  at(p) { // point at fraction p of length
    const target = this.total * clamp(p), pts = this.pts;
    for (let i = 1; i < pts.length; i++) if (this.L[i] >= target) {
      const f = (target - this.L[i - 1]) / (this.L[i] - this.L[i - 1] || 1);
      return [lerp(pts[i - 1][0], pts[i][0], f), lerp(pts[i - 1][1], pts[i][1], f)];
    }
    return pts[pts.length - 1];
  }
}
function wob(pts, seed, amp) { // subdivide a polyline and add a hand-drawn tremor
  if (!amp) return pts;
  const w = wobble(seed, amp), out = [];
  let s = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const [x1, y1] = pts[i], [x2, y2] = pts[i + 1], L = Math.hypot(x2 - x1, y2 - y1) || 1;
    const n = Math.max(1, Math.ceil(L / 9)), nx = -(y2 - y1) / L, ny = (x2 - x1) / L;
    for (let k = 0; k < n; k++) { const t = k / n, o = w(s + t * L); out.push([x1 + (x2 - x1) * t + nx * o, y1 + (y2 - y1) * t + ny * o]); }
    s += L;
  }
  out.push(pts[pts.length - 1]);
  return out;
}
const ln = (x1, y1, x2, y2, seed = 1, amp = 0.9) => new P(wob([[x1, y1], [x2, y2]], seed, amp));
const pl = (pts, closed = false, seed = 1, amp = 0.7) => new P(wob(closed ? pts.concat([pts[0]]) : pts, seed, amp).slice(0, closed ? -1 : undefined), closed);
function el(cx, cy, rx, ry, a0 = 0, a1 = TAU, seed = 1, amp = 0.9, rot = 0) {
  const span = a1 - a0, L = Math.abs(span) * (rx + ry) / 2, n = Math.max(12, Math.ceil(L / 7));
  const w = wobble(seed, amp), cr = Math.cos(rot), sr = Math.sin(rot), pts = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, a = a0 + span * t, o = w(t * L), x = (rx + o) * Math.cos(a), y = (ry + o * ry / rx) * Math.sin(a);
    pts.push([cx + x * cr - y * sr, cy + x * sr + y * cr]);
  }
  const closed = Math.abs(span) >= TAU - 1e-6;
  if (closed) pts.pop();
  return new P(pts, closed);
}
function quad(p0, c, p1, n = 16) {
  const pts = [];
  for (let i = 0; i <= n; i++) { const t = i / n, u = 1 - t; pts.push([u * u * p0[0] + 2 * u * t * c[0] + t * t * p1[0], u * u * p0[1] + 2 * u * t * c[1] + t * t * p1[1]]); }
  return pts;
}
function cubic(p0, c1, c2, p1, n = 40) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, u = 1 - t;
    pts.push([u * u * u * p0[0] + 3 * u * u * t * c1[0] + 3 * u * t * t * c2[0] + t * t * t * p1[0],
      u * u * u * p0[1] + 3 * u * u * t * c1[1] + 3 * u * t * t * c2[1] + t * t * t * p1[1]]);
  }
  return pts;
}
function yOn(pts, x) { // y of a polyline sampled left to right, at x (clamped to its ends)
  if (x <= pts[0][0]) return pts[0][1];
  for (let i = 1; i < pts.length; i++) if (x <= pts[i][0]) { const f = (x - pts[i - 1][0]) / (pts[i][0] - pts[i - 1][0] || 1); return lerp(pts[i - 1][1], pts[i][1], f); }
  return pts[pts.length - 1][1];
}
function starP(cx, cy, r1, r2, n, rot = -Math.PI / 2) {
  const pts = [];
  for (let i = 0; i < n * 2; i++) { const r = i % 2 ? r2 : r1, a = rot + (i * Math.PI) / n; pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); }
  return new P(pts, true);
}

/* ---------- ink on paper ---------- */
function stroke(path, p = 1, col = INK, lw = 2, a = 0.92, dash = null, dashOff = 0) {
  if (p <= 0) return;
  ctx.save();
  ctx.globalAlpha = SA * a; ctx.globalCompositeOperation = 'multiply';
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (dash) { ctx.setLineDash(dash); ctx.lineDashOffset = dashOff; }
  ctx.beginPath(); path.trace(ctx, p); ctx.stroke();
  ctx.restore();
}
function fill(path, col, a = 1) {
  if (a <= 0) return;
  ctx.save();
  ctx.globalAlpha = SA * a; ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = col;
  ctx.beginPath(); path.trace(ctx, 1); ctx.fill();
  ctx.restore();
}
let PAPER_CV, PAPER_PAT, SPECKLE_CV;
function mask(paths) { // repaint paper over paths (hides lines behind a shape)
  ctx.save();
  PAPER_PAT.setTransform(ctx.getTransform().inverse());
  ctx.globalAlpha = SA; ctx.fillStyle = PAPER_PAT;
  ctx.beginPath(); (Array.isArray(paths) ? paths : [paths]).forEach(q => q.trace(ctx, 1)); ctx.fill();
  ctx.restore();
}
function hatch(clip, box, ang, gap, p, col = INK, lw = 1, a = 0.35, seed = 3) {
  if (p <= 0) return;
  const [x0, y0, x1, y1] = box, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, R = Math.hypot(x1 - x0, y1 - y0) / 2;
  const dx = Math.cos(ang), dy = Math.sin(ang), nx = -dy, ny = dx, n = Math.floor((2 * R) / gap), shown = Math.floor(n * p), r = rng(seed);
  ctx.save();
  ctx.beginPath(); (Array.isArray(clip) ? clip : [clip]).forEach(q => q.trace(ctx, 1)); ctx.clip();
  ctx.globalAlpha = SA * a; ctx.globalCompositeOperation = 'multiply'; ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath();
  for (let i = 0; i < shown; i++) {
    const o = -R + i * gap + (r() - 0.5) * gap * 0.3, px = cx + nx * o, py = cy + ny * o, j = (r() - 0.5) * R * 0.08;
    ctx.moveTo(px - dx * (R + j), py - dy * (R + j)); ctx.lineTo(px + dx * (R - j), py + dy * (R - j));
  }
  ctx.stroke(); ctx.restore();
}
function disc(x, y, r, col, a = 1, mode = 'multiply') {
  if (a <= 0 || r <= 0) return;
  ctx.save(); ctx.globalAlpha = SA * a; ctx.globalCompositeOperation = mode; ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); ctx.restore();
}
function arrowHead(x, y, ang, size, col, a = 0.92, lw = 2) {
  stroke(new P([[x - size * Math.cos(ang - 0.45), y - size * Math.sin(ang - 0.45)], [x, y], [x - size * Math.cos(ang + 0.45), y - size * Math.sin(ang + 0.45)]]), 1, col, lw, a);
}

/* ---------- type ---------- */
const F_HEAD = 'Cinzel', F_MONO = '"IBM Plex Mono"', F_AR = '"Reem Kufi"', F_RUQ = '"Aref Ruqaa"', F_FELL = '"IM Fell English"';
let HEAD_SIZE = 96;
function setText(font, ls = 0, dir = 'ltr', align = 'left') {
  ctx.font = font; ctx.letterSpacing = ls + 'px'; ctx.direction = dir; ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
}
function typeLine(text, x, y, t0, lt, { size = 20, ls = 7, a = 0.85, weight = 500, align = 'left', cps = 58, col = INK } = {}) {
  const n = Math.floor(clamp((lt - t0) * cps, 0, text.length));
  if (n <= 0) return;
  ctx.save();
  setText(`${weight} ${size}px ${F_MONO}`, ls);
  let sx = x;
  if (align === 'center') sx = x - ctx.measureText(text).width / 2;
  if (align === 'right') sx = x - ctx.measureText(text).width;
  ctx.globalAlpha = SA * a; ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = col;
  ctx.fillText(text.slice(0, n), sx, y);
  ctx.restore();
}
function blurIn(draw, p, maxBlur = 14, dx = 26) {
  if (p <= 0) return;
  ctx.save();
  ctx.globalAlpha = SA * p; ctx.globalCompositeOperation = 'multiply';
  const b = (1 - p) * maxBlur;
  if (b > 0.25) ctx.filter = `blur(${b.toFixed(2)}px)`;
  draw((1 - p) * dx);
  ctx.restore();
}
// Big inscriptional headline, revealed word by word (blur to sharp).
function headline(lines, accent, x, top, t0, lt, { size = HEAD_SIZE, align = 'left', step = 0.14 } = {}) {
  setText(`900 ${size}px ${F_HEAD}`, 1);
  let wi = 0, y = top + size * 0.88;
  for (const line of lines) {
    const words = line.split(' '), sp = ctx.measureText(' ').width;
    const widths = words.map(w => ctx.measureText(w).width);
    let wx = align === 'center' ? x - (widths.reduce((s, v) => s + v, 0) + sp * (words.length - 1)) / 2 : x;
    words.forEach((w, i) => {
      const p = easeOut(prog(lt, t0 + wi * step, 0.8));
      blurIn(off => { setText(`900 ${size}px ${F_HEAD}`, 1); ctx.fillStyle = accent[w] || INK; ctx.fillText(w, wx + off, y); }, p);
      wx += widths[i] + sp; wi++;
    });
    y += size * 1.06;
  }
  return { bottom: y - size * 1.06, words: wi };
}
function arabic(text, x, y, t0, lt, { size = 58, align = 'left', a = 0.9, font = F_AR, weight = 700 } = {}) {
  const p = easeOut(prog(lt, t0, 0.9));
  blurIn(off => {
    setText(`${weight} ${size}px ${font}`, 0, 'rtl', align);
    ctx.wordSpacing = '6px';
    ctx.globalAlpha *= a; ctx.fillStyle = INK; ctx.fillText(text, x + (align === 'left' ? off : -off), y);
  }, p, 12, 18);
}
function note(text, x, y, t0, lt, { ar = false, size, a = 0.34, align = 'right' } = {}) {
  const p = prog(lt, t0, 1.4);
  if (p <= 0) return;
  ctx.save();
  if (ar) setText(`400 ${size || 30}px ${F_RUQ}`, 0, 'rtl', align);
  else setText(`italic 400 ${size || 25}px ${F_FELL}`, 0, 'ltr', align);
  ctx.globalAlpha = SA * p * a; ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = INK;
  ctx.fillText(text, x, y);
  ctx.restore();
}
// Paper patch behind a small label so engraved lines don't cut through it.
function back(text, x, y, align, p, size = 14, ls = 3) {
  if (p <= 0) return;
  ctx.save();
  setText(`600 ${size}px ${F_MONO}`, ls, 'ltr', 'left');
  const w = ctx.measureText(text).width, x0 = align === 'right' ? x - w : x;
  PAPER_PAT.setTransform(ctx.getTransform().inverse());
  ctx.globalAlpha = SA * p * 0.92; ctx.fillStyle = PAPER_PAT; ctx.fillRect(x0 - 7, y - size - 3, w + 12, size + 10);
  ctx.restore();
}
function small(text, x, y, p, { size = 15, ls = 4, a = 0.8, align = 'left', col = INK, weight = 500 } = {}) {
  if (p <= 0) return;
  ctx.save();
  setText(`${weight} ${size}px ${F_MONO}`, ls, 'ltr', align);
  ctx.globalAlpha = SA * a * p; ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = col;
  ctx.fillText(text, x, y);
  ctx.restore();
}
function smallAr(text, x, y, p, { size = 22, a = 0.8, align = 'left', weight = 500 } = {}) {
  if (p <= 0) return;
  ctx.save();
  setText(`${weight} ${size}px ${F_AR}`, 0, 'rtl', align);
  ctx.globalAlpha = SA * a * p; ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = INK;
  ctx.fillText(text, x, y);
  ctx.restore();
}

/* ---------- chapter chrome: label (top left), readout (top right) ---------- */
function chrome(s, lt) {
  // Labels switch at the cut: the old one is gone just before the new one appears.
  const rl = REAL_LT, vis = clamp(rl / 0.2) * clamp((s.dur - rl) / 0.2);
  const p = easeOut(prog(lt, 0, 0.8)) * vis;
  const name = (s.num ? s.num + ' · ' : '') + s.name;
  small(name, 78, 72, p, { size: 18, ls: 7, a: 0.82 });
  setText(`500 18px ${F_MONO}`, 7);
  smallAr(s.ar, 78 + ctx.measureText(name).width + 18, 74, p, { size: 23, a: 0.72 });
  typeLine(s.readout, W - 78, 104, 0.2, lt, { size: 13, ls: 4, a: 0.5 * vis, align: 'right', cps: 60 });
}
// Left column: mono kicker, inscriptional headline, Arabic line.
function textBlock(s, lt) {
  const x = 110, ky = 338;
  typeLine(s.kicker, x, ky, 0.25, lt, { size: 18, ls: 6, a: 0.8 });
  const hb = headline(s.head, s.accent, x, ky + 30, 0.55, lt);
  arabic(s.arHead, x, hb.bottom + 92, 0.55 + hb.words * 0.14 + 0.1, lt, { size: 56 });
}

/* ---------- scenes ---------- */
const SCENES = [];
const scene = s => SCENES.push(s);

// Prologue
scene({
  start: 0, dur: 6, num: '', name: 'PROLOGUE', ar: 'المقدمة', readout: '2007 — 2027',
  init() {
    this.horizon = ln(620, 380, 1300, 380, 11, 0.8);
  },
  draw(lt) {
    chrome(this, lt);
    const sp = easeOut(prog(lt, 0.5, 1.6));
    if (sp > 0) {
      const tw = 1 + 0.06 * Math.sin(lt * 3.1);
      fill(starP(960, 262, 30 * sp * tw, 11 * sp, 8), OCHRE, 0.95);
      stroke(starP(960, 262, 30 * sp * tw, 11 * sp, 8), 1, INK, 1.4, 0.8);
      disc(960, 262, 4 * sp, RED);
      for (let i = 0; i < 16; i++) {
        const a = (i / 16) * TAU + lt * 0.22, r0 = 44, r1 = i % 2 ? 62 : 80, q = prog(lt, 1.2 + i * 0.03, 0.6);
        stroke(ln(960 + r0 * Math.cos(a), 262 + r0 * Math.sin(a), 960 + r1 * Math.cos(a), 262 + r1 * Math.sin(a), 40 + i, 0.2), q, INK, 1.1, 0.55);
      }
    }
    stroke(this.horizon, easeInOut(prog(lt, 0.9, 1.8)), INK, 1.4, 0.6);
    typeLine('UNITED ARAB EMIRATES', 960, 448, 1.0, lt, { size: 18, ls: 8, align: 'center' });
    headline(['READING THE SKY'], {}, 960, 505, 1.5, lt, { size: 122, align: 'center', step: 0.22 });
    arabic('قراءة السماء', 960, 715, 2.3, lt, { size: 70, align: 'center' });
    typeLine('A FILM FOR THE 20TH ANNIVERSARY OF THE NATIONAL CENTER OF METEOROLOGY', 960, 800, 2.6, lt, { size: 15, ls: 5, align: 'center', a: 0.7, cps: 60 });
  },
});

// I · Al Durour — the 36-petal calendar wheel and the rising of Suhail
scene({
  start: 6, dur: 8, speed: 11 / 8, num: 'I', name: 'AL DUROUR', ar: 'الدرور', readout: 'SUHAIL · α CARINAE',
  kicker: 'THE DUROUR CALENDAR · 36 × 10 DAYS + 5',
  head: ['WE COUNTED', 'THE YEAR', 'BY A STAR.'], accent: { 'STAR.': RED },
  arHead: 'عددنا أيام السنة بطلوع سهيل',
  init() {
    const cx = 1420, cy = 575, N = 36, step = TAU / N;
    Object.assign(this, { cx, cy, petals: [], mullions: [], lozenges: [], dots: [], cols: [] });
    const pt = (r, a) => [cx + r * Math.cos(a), cy + r * Math.sin(a)];
    for (let i = 0; i < N; i++) {
      const a = -Math.PI / 2 + i * step, h = step * 0.43, r1 = 262, r2 = 372;
      const pts = quad(pt(r1, a - h), pt(r1 + (r2 - r1) * 0.72, a - h * 0.92), pt(r2, a), 12)
        .concat(quad(pt(r2, a), pt(r1 + (r2 - r1) * 0.72, a + h * 0.92), pt(r1, a + h), 12).slice(1));
      this.petals.push(new P(wob(pts, 100 + i, 0.45)));
      this.mullions.push(ln(...pt(r1 + 6, a), ...pt(r1 + (r2 - r1) * 0.52, a), 200 + i, 0.25));
      this.lozenges.push(new P([pt(186, a), pt(214, a - h * 0.8), pt(243, a), pt(214, a + h * 0.8)], true));
      this.dots.push(pt(231, a));
      this.cols.push(i < 10 ? OCHRE : i < 20 ? BLUE : i < 30 ? RED : SEPIA);
    }
    this.rings = [el(cx, cy, 256, 256, 0, TAU, 5), el(cx, cy, 248, 248, 0, TAU, 6), el(cx, cy, 180, 180, 0, TAU, 7), el(cx, cy, 124, 124, 0, TAU, 8), el(cx, cy, 382, 382, 0, TAU, 9, 1.1)];
    const hy = cy + 36, hw = Math.sqrt(124 * 124 - 36 * 36);
    this.hy = hy;
    this.horizon = ln(cx - hw, hy, cx + hw, hy, 12, 0.4);
    this.dunes = [pl([[cx - 110, hy + 38], [cx - 60, hy + 22], [cx - 10, hy + 34], [cx + 40, hy + 18], [cx + 105, hy + 40]], false, 13, 0.5),
      pl([[cx - 95, hy + 66], [cx - 30, hy + 52], [cx + 30, hy + 64], [cx + 90, hy + 55]], false, 14, 0.5)];
    this.stolen = [];
    const ab = -Math.PI / 2 - step / 2;
    for (let k = 0; k < 5; k++) this.stolen.push(pt(400, ab + (k - 2) * 0.05));
    const sp = [];
    for (let i = 0; i <= 180; i++) { const t = i / 180, a = -Math.PI / 2 + 0.35 + TAU * 0.82 * t, r = 404 + 48 * t; sp.push(pt(r, a)); }
    this.spiral = new P(wob(sp, 17, 0.6));
  },
  draw(lt) {
    chrome(this, lt); textBlock(this, lt);
    note('طلوع سهيل', 1862, 168, 5.2, lt, { ar: true, size: 32 });
    note('الخمس المساريق', 1862, 214, 5.8, lt, { ar: true, size: 28 });
    const { cx, cy } = this;
    ctx.save();
    const z = 1 + 0.03 * easeInOut(prog(lt, 0, 11));
    ctx.translate(cx, cy); ctx.scale(z, z); ctx.rotate(lt * 0.06); ctx.translate(-cx, -cy); // the year turns

/* ---------- paper, light, and the frame ---------- */
function makePaper() {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'), r = rng(7);
  g.fillStyle = '#E4D7BE'; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 80; i++) {
    const x = r() * W, y = r() * H, rad = 80 + r() * 420, light = r() < 0.55, a = 0.03 + r() * 0.05;
    const grd = g.createRadialGradient(x, y, 0, x, y, rad);
    grd.addColorStop(0, light ? `rgba(250,243,228,${a})` : `rgba(140,112,78,${a})`); grd.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grd; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }
  g.strokeStyle = 'rgba(120,96,66,0.10)'; g.lineWidth = 0.7;
  for (let i = 0; i < 520; i++) { const x = r() * W, y = r() * H, a = r() * TAU, L = 10 + r() * 40; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a + 0.4) * L * 0.5, y + Math.sin(a + 0.4) * L * 0.5, x + Math.cos(a) * L, y + Math.sin(a) * L); g.stroke(); }
  const img = g.getImageData(0, 0, W, H), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const n = (r() - 0.5) * 18; d[i] += n; d[i + 1] += n; d[i + 2] += n * 0.9; }
  g.putImageData(img, 0, 0);
  return c;
}
function makeSpeckle() {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'), r = rng(19);
  for (let i = 0; i < 90000; i++) { g.fillStyle = `rgba(255,250,238,${0.25 + r() * 0.6})`; g.fillRect(r() * W, r() * H, r() < 0.8 ? 1 : 2, 1); }
  return c;
}
function corners(a) {
  ctx.save(); ctx.globalAlpha = a * 0.7; ctx.globalCompositeOperation = 'multiply'; ctx.strokeStyle = INK; ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(42, 78); ctx.lineTo(42, 42); ctx.lineTo(78, 42);
  ctx.moveTo(W - 78, 42); ctx.lineTo(W - 42, 42); ctx.lineTo(W - 42, 78);
  ctx.stroke(); ctx.restore();
}
function light(t) {
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  const gx = 560 + Math.sin(t * 0.05) * 120, glow = ctx.createRadialGradient(gx, 520, 0, gx, 520, 820);
  glow.addColorStop(0, 'rgba(255,246,226,0.20)'); glow.addColorStop(1, 'rgba(255,246,226,0)');
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
  // two slow light shafts from the upper left
  [[-240 + t * 7, 260, 0.07], [260 + t * 5, 150, 0.05]].forEach(([x, w, a]) => {
    ctx.save(); ctx.translate(x, -100); ctx.rotate(-0.62);
    const g = ctx.createLinearGradient(-w, 0, w, 0);
    g.addColorStop(0, 'rgba(255,248,232,0)'); g.addColorStop(0.5, `rgba(255,248,232,${a})`); g.addColorStop(1, 'rgba(255,248,232,0)');
    ctx.fillStyle = g; ctx.fillRect(-w, -400, w * 2, 3000); ctx.restore();
  });
  ctx.globalAlpha = 0.09; ctx.drawImage(SPECKLE_CV, 0, 0);
  ctx.restore();
  ctx.save();
  ctx.globalCompositeOperation = 'multiply';
  const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.42, W / 2, H / 2, H * 1.05);
  v.addColorStop(0, 'rgba(255,255,255,1)'); v.addColorStop(1, 'rgba(178,150,116,1)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.restore();
}
const XF = 0.4, DURATION = 114, BAR = 2; // 120 BPM
function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  ctx.drawImage(PAPER_CV, 0, 0);
  // every cut lands on a downbeat: a small punch-in and a flash of light
  let since = Infinity;
  SCENES.forEach((s, i) => { if (i > 0 && t >= s.start) since = Math.min(since, t - s.start); });
  const punch = since < 0.8 ? 0.022 * Math.exp(-since * 6) : 0;
  ctx.save();
  if (punch) { ctx.translate(W / 2, H / 2); ctx.scale(1 + punch, 1 + punch); ctx.translate(-W / 2, -H / 2); }
  // Crossfade: the outgoing scene is drawn at full strength; the incoming one is drawn whole on its
  // own sheet of paper and laid over it at alpha a. Its masks then only ever cover its own paper.
  let first = true;
  SCENES.forEach((s, i) => {
    const lt = t - s.start;
    let a = 1;
    if (i > 0) a = Math.min(a, clamp((lt + XF / 2) / XF));
    if (i < SCENES.length - 1) a = Math.min(a, clamp((s.dur + XF / 2 - lt) / XF));
    if (a <= 0) return;
    SA = 1; REAL_LT = lt;
    if (first) { first = false; ctx.save(); s.draw(lt * (s.speed || 1)); ctx.restore(); return; }
    ctx = LAYER;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
    ctx.drawImage(PAPER_CV, 0, 0);
    ctx.setTransform(MAIN.getTransform()); // keep the punch-in
    ctx.save(); s.draw(lt * (s.speed || 1)); ctx.restore();
    ctx = MAIN;
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = a; ctx.drawImage(LAYER_CV, 0, 0); ctx.restore();
  });
  ctx.restore();
  SA = 1;
  corners(1);
  small('NCM · XX', W - 78, 72, 1, { size: 18, ls: 8, align: 'right', weight: 600, a: 0.85 });
  light(t);
  if (since < 0.6) { ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.fillStyle = `rgba(255,246,228,${(0.2 * Math.exp(-since * 9)).toFixed(3)})`; ctx.fillRect(0, 0, W, H); ctx.restore(); }
  const fadeIn = 1 - easeOut(prog(t, 0, 1.6)), fadeOut = easeInOut(prog(t, DURATION - 1.8, 1.8)), dark = Math.max(fadeIn, fadeOut);
  if (dark > 0) { ctx.fillStyle = `rgba(20,16,12,${dark})`; ctx.fillRect(0, 0, W, H); }
}

/* ---------- boot ---------- */
async function boot() {
  const fonts = ['900 100px Cinzel', '700 100px Cinzel', '500 20px "IBM Plex Mono"', '600 20px "IBM Plex Mono"', 'italic 400 24px "IM Fell English"'];
  const arFonts = ['700 60px "Reem Kufi"', '500 24px "Reem Kufi"', '400 30px "Aref Ruqaa"'];
  await Promise.all(fonts.map(f => document.fonts.load(f, 'AZ az 09 ·')).concat(arFonts.map(f => document.fonts.load(f, 'السماء عربي'))));
  await document.fonts.ready;
  LAYER_CV = document.createElement('canvas'); LAYER_CV.width = W; LAYER_CV.height = H; LAYER = LAYER_CV.getContext('2d');
  PAPER_CV = makePaper(); SPECKLE_CV = makeSpeckle(); PAPER_PAT = ctx.createPattern(PAPER_CV, 'no-repeat');
  // one headline size for every chapter: the widest line must fit the left column
  setText(`900 100px ${F_HEAD}`, 1);
  let widest = 0;
  SCENES.forEach(s => s.head && s.head.forEach(l => { widest = Math.max(widest, ctx.measureText(l).width); }));
  HEAD_SIZE = Math.min(104, Math.floor((810 / widest) * 100));
  SCENES.sort((a, b) => a.start - b.start);
  SCENES.forEach(s => s.init && s.init());
  return true;
}
const params = new URLSearchParams(location.search);
window.__duration = DURATION;
window.__ready = boot().then(() => {
  if (params.has('capture')) { window.__render = render; render(Number(params.get('t') || 0)); return true; }
  const t0 = performance.now() - Number(params.get('t') || 0) * 1000;
  const loop = () => { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  cv.addEventListener('click', () => location.reload());
  return true;
});
