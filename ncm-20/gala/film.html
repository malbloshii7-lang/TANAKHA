<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reading the Sky · Gala Edition</title>
<meta name="description" content="A short film for the 20th anniversary of the UAE National Center of Meteorology, rendered live on a canvas. The MP4 in this folder is the same film, frame for frame, with its score." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400&family=Cinzel:wght@700;900&family=IBM+Plex+Mono:wght@500;600&family=IM+Fell+English:ital@0;1&family=Reem+Kufi:wght@500;700&family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Kufi+Arabic:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  html,body{margin:0;height:100%;background:#14110e}
  body{display:grid;place-items:center;overflow:hidden}
  canvas{display:block;width:min(100vw,calc(100vh * 16 / 9));height:auto;aspect-ratio:16/9}
</style>
</head>
<body>
<canvas id="film" width="1920" height="1080" aria-label="Reading the Sky: a film for the 20th anniversary of the National Center of Meteorology"></canvas>
<script src="engine.js"></script>

<script src="scenes/plate-monsoon.js"></script>
<script src="scenes/plate-pearling.js"></script>
<script src="scenes/plate-port.js"></script>

</html>
