<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STANDARD — Ministerial Document Cockpit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="header-content">
      <h1>STANDARD</h1>
      <p>Ministerial Document Cockpit</p>
    </div>
  </header>

  <main class="container">
    <form id="speechForm" class="form">
      <fieldset class="fieldset">
        <legend>Speech Metadata</legend>

        <div class="form-group">
          <label for="occasion">Occasion *</label>
          <input type="text" id="occasion" name="occasion" placeholder="e.g., Kazakhstan Cloud Seeding Launch" required>
        </div>

        <div class="form-group">
          <label for="principal">Principal (Speaker) *</label>
          <input type="text" id="principal" name="principal" placeholder="e.g., H.E. Dr. Abdulla Al Mandoos" required>
        </div>

        <div class="form-group">
          <label for="audience">Opening Salutation *</label>
          <input type="text" id="audience" name="audience" placeholder="e.g., Distinguished Deputy Prime Minister Madiyev, Excellencies..." required>
        </div>

        <div class="form-group">
          <label for="location">Location</label>
          <input type="text" id="location" name="location" placeholder="e.g., Turkistan, Republic of Kazakhstan">
        </div>

        <div class="form-group">
          <label for="date">Date</label>
          <input type="date" id="date" name="date">
        </div>

        <div class="form-group">
          <label for="language">Output Language *</label>
          <select id="language" name="language" required>
            <option value="en">English (LTR)</option>
            <option value="ar">العربية (RTL)</option>
          </select>
        </div>
      </fieldset>

      <fieldset class="fieldset">
        <legend>Speech Body</legend>
        <div id="bodyItems"></div>
        <button type="button" id="addParagraph" class="btn-secondary">+ Add Paragraph</button>
      </fieldset>

      <fieldset class="fieldset">
        <legend>Closing</legend>
        <div class="form-group">
          <label for="closing">Closing Text *</label>
          <textarea id="closing" name="closing" placeholder="e.g., Thank you." required></textarea>
        </div>
      </fieldset>

      <div class="actions">
        <button type="submit" class="btn-primary">Generate Document</button>
        <button type="reset" class="btn-secondary">Clear Form</button>
      </div>

      <div id="status" class="status"></div>
    </form>
  </main>

  <script src="app.js"></script>
</body>
</html>
