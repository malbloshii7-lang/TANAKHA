name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: climate-command-center/package-lock.json

      - name: Install Climate Command Center dependencies
        working-directory: climate-command-center
        run: npm ci

      - name: Build Climate Command Center
        working-directory: climate-command-center
        run: npm run build

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html builder.html lvmh-empire.html the-art-of-crafting-prompts.html _site/ 2>/dev/null || true
          cp -r portal _site/portal
          mkdir -p _site/climate
          cp -r climate-command-center/dist/. _site/climate/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
