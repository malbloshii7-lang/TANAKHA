<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meteorology Brief · NCM International Affairs</title>
  <meta name="description" content="What's new across the global meteorology sector — WMO, NMHS, climate and water." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet" />
  <style>
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --surface-2: #fafbfc;
  --border: #e3e8ef;
  --text: #0f1b2d;
  --text-soft: #5b6b80;
  --text-faint: #8a99ac;
  --brand: #0a4d8c;
  --brand-soft: #e8f1fb;
  --accent: #0e98d6;
  --shadow: 0 1px 2px rgba(16,33,55,.04), 0 8px 24px rgba(16,33,55,.06);
  --shadow-hover: 0 2px 6px rgba(16,33,55,.08), 0 16px 40px rgba(16,33,55,.10);
  --radius: 14px;
  --maxw: 880px;

  /* sector accent colours */
  --c-governance: #7c3aed;
  --c-operations: #0a4d8c;
  --c-science: #0e98d6;
  --c-climate: #15a06a;
  --c-water: #0891b2;
}

[data-theme="dark"] {
  --bg: #0a1018;
  --surface: #121b27;
  --surface-2: #0f1721;
  --border: #21303f;
  --text: #e8eef6;
  --text-soft: #9fb0c3;
  --text-faint: #6b7c91;
  --brand: #4ea3e8;
  --brand-soft: #15263a;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  --shadow-hover: 0 2px 6px rgba(0,0,0,.4), 0 16px 40px rgba(0,0,0,.5);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: "Inter", system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* ---------- Masthead ---------- */
.masthead {
  position: sticky;
  top: 0;
  z-index: 20;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: saturate(180%) blur(12px);
  border-bottom: 1px solid var(--border);
}
.masthead-inner {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 16px 20px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark {
  width: 42px; height: 42px;
  display: grid; place-items: center;
  border-radius: 12px;
  color: #fff;
  background: linear-gradient(135deg, var(--brand), var(--accent));
  box-shadow: 0 4px 12px rgba(10,77,140,.3);
}
.brand-text h1 {
  font-family: "Newsreader", Georgia, serif;
  font-size: 1.4rem;
  font-weight: 600;
  letter-spacing: -0.01em;
  line-height: 1.1;
}
.brand-text p {
  font-size: .76rem;
  color: var(--text-faint);
  font-weight: 500;
  letter-spacing: .01em;
}
.masthead-actions { display: flex; align-items: center; gap: 10px; }
.search {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0 12px;
  height: 40px;
  color: var(--text-faint);
  transition: border-color .15s, box-shadow .15s;
}
.search:focus-within {
  border-color: var(--brand);
  box-shadow: 0 0 0 3px var(--brand-soft);
}
.search input {
  border: 0; background: transparent; outline: none;
  font: inherit; color: var(--text);
  width: 170px;
}
.icon-btn {
  width: 40px; height: 40px;
  display: grid; place-items: center;
  border: 1px solid var(--border);
  background: var(--surface-2);
  border-radius: 10px;
  color: var(--text-soft);
  cursor: pointer;
  transition: background .15s, color .15s, border-color .15s;
}
.icon-btn:hover { color: var(--brand); border-color: var(--brand); }
.icon-moon { display: none; }
[data-theme="dark"] .icon-sun { display: none; }
[data-theme="dark"] .icon-moon { display: block; }

/* ---------- Filters ---------- */
.filters {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 0 20px 14px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.chip {
  font: inherit;
  font-size: .82rem;
  font-weight: 500;
  padding: 6px 14px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-soft);
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.chip:hover { border-color: var(--brand); color: var(--brand); }
.chip.active {
  background: var(--brand);
  border-color: var(--brand);
  color: #fff;
}

/* ---------- Status bar ---------- */
.wrap { max-width: var(--maxw); margin: 0 auto; padding: 22px 20px 60px; }
.status-bar {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 16px;
  font-size: .78rem;
}
.result-count { color: var(--text-soft); font-weight: 500; }
.freshness { color: var(--text-faint); }

/* ---------- Feed ---------- */
.feed { display: flex; flex-direction: column; gap: 14px; }
.card {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px 18px 22px;
  box-shadow: var(--shadow);
  transition: transform .16s ease, box-shadow .16s ease, border-color .16s;
  overflow: hidden;
  animation: rise .4s ease backwards;
}
.card::before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--accent-bar, var(--brand));
}
.card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-hover);
  border-color: color-mix(in srgb, var(--accent-bar, var(--brand)) 40%, var(--border));
}
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }

.card-top {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.badge {
  font-size: .72rem;
  font-weight: 600;
  padding: 3px 9px;
  border-radius: 6px;
  color: #fff;
  letter-spacing: .01em;
}
.sector-tag {
  font-size: .7rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .05em;
  color: var(--accent-bar, var(--brand));
}
.tier1-dot {
  font-size: .68rem;
  color: var(--text-faint);
  display: inline-flex; align-items: center; gap: 4px;
}
.tier1-dot::before {
  content: ""; width: 6px; height: 6px; border-radius: 50%;
  background: #d4a017;
}
.time { margin-left: auto; font-size: .74rem; color: var(--text-faint); white-space: nowrap; }

.card h2 {
  font-family: "Newsreader", Georgia, serif;
  font-size: 1.22rem;
  font-weight: 600;
  line-height: 1.3;
  letter-spacing: -0.01em;
  margin-bottom: 6px;
}
.card h2 a { color: var(--text); text-decoration: none; }
.card h2 a:hover { color: var(--brand); }
.card p.summary {
  font-size: .92rem;
  color: var(--text-soft);
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-foot {
  margin-top: 12px;
  display: flex; align-items: center; gap: 6px;
}
.read-link {
  font-size: .8rem; font-weight: 600;
  color: var(--brand);
  text-decoration: none;
  display: inline-flex; align-items: center; gap: 5px;
}
.read-link svg { transition: transform .15s; }
.read-link:hover svg { transform: translateX(3px); }
.source-full { font-size: .76rem; color: var(--text-faint); }

/* ---------- Empty / loading ---------- */
.empty { text-align: center; padding: 60px 20px; color: var(--text-faint); }
.skeleton {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  height: 112px;
  position: relative; overflow: hidden;
}
.skeleton::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--text) 4%, transparent), transparent);
  transform: translateX(-100%);
  animation: shimmer 1.4s infinite;
}
@keyframes shimmer { to { transform: translateX(100%); } }

/* ---------- Footer ---------- */
.foot {
  border-top: 1px solid var(--border);
  padding: 22px 20px;
  text-align: center;
}
.foot p { font-size: .76rem; color: var(--text-faint); max-width: var(--maxw); margin: 0 auto; }

/* ---------- Responsive ---------- */
@media (max-width: 600px) {
  .brand-text p { display: none; }
  .search input { width: 110px; }
  .brand-text h1 { font-size: 1.2rem; }
  .card h2 { font-size: 1.1rem; }
}

</style>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.5 19a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.6-1.5A4 4 0 0 0 6 19z" />
            <path d="M8 22l1-2M12 22l1-2M16 22l1-2" />
          </svg>
        </div>
        <div class="brand-text">
          <h1>Meteorology Brief</h1>
          <p>NCM · International Affairs — sector monitor</p>
        </div>
      </div>
      <div class="masthead-actions">
        <div class="search">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="search" type="search" placeholder="Search updates…" autocomplete="off" />
        </div>
        <button id="theme-toggle" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
        </button>
      </div>
    </div>
    <nav class="filters" id="filters" aria-label="Filter by sector"></nav>
  </header>

  <main class="wrap">
    <div class="status-bar">
      <span id="result-count" class="result-count"></span>
      <span id="freshness" class="freshness"></span>
    </div>
    <section id="feed" class="feed" aria-live="polite"></section>
    <div id="empty" class="empty" hidden>
      <p>No updates match your filters.</p>
    </div>
  </main>

  <footer class="foot">
    <p>Aggregated from public RSS feeds of WMO, NMHS and partner bodies · concept build for internal use.</p>
  </footer>

  <script>
const EMBEDDED_FEED = {
  "generated_at": "2026-06-02T06:00:00+00:00",
  "sources_ok": 9,
  "sources_failed": 0,
  "count": 8,
  "note": "Sample data so the interface renders before live feeds are wired. Replace by running: python -m metfeed.fetch",
  "items": [
    {
      "title": "WMO Executive Council opens 79th session with focus on Early Warnings for All",
      "summary": "The Executive Council convened in Geneva to review progress on the Early Warnings for All initiative, with member states pressing for accelerated coverage across least-developed countries and small island states.",
      "link": "https://wmo.int/",
      "published": "2026-06-02T05:10:00+00:00",
      "source_id": "wmo",
      "source": "WMO",
      "source_full": "World Meteorological Organization",
      "category": "Governance",
      "tier": 1
    },
    {
      "title": "ECMWF brings AIFS machine-learning forecasts into operational suite",
      "summary": "The centre announced its Artificial Intelligence Forecasting System has moved to operational status, running alongside the physics-based model and delivering competitive medium-range skill at a fraction of the compute cost.",
      "link": "https://www.ecmwf.int/",
      "published": "2026-06-01T14:30:00+00:00",
      "source_id": "ecmwf",
      "source": "ECMWF",
      "source_full": "European Centre for Medium-Range Weather Forecasts",
      "category": "Operations",
      "tier": 1
    },
    {
      "title": "UNFCCC publishes synthesis of updated national climate plans ahead of COP",
      "summary": "A new synthesis report aggregates the latest nationally determined contributions, signalling incremental ambition but a persistent gap against the 1.5°C pathway as parties prepare for the next Conference.",
      "link": "https://unfccc.int/",
      "published": "2026-06-01T09:00:00+00:00",
      "source_id": "unfccc",
      "source": "UNFCCC",
      "source_full": "UN Climate Change",
      "category": "Governance",
      "tier": 1
    },
    {
      "title": "Copernicus: May 2026 ranks among warmest on record globally",
      "summary": "The Copernicus Climate Change Service reports surface air temperatures well above the 1991–2020 average, with notable marine heatwave activity across the Mediterranean and Arabian Gulf.",
      "link": "https://climate.copernicus.eu/",
      "published": "2026-05-31T08:15:00+00:00",
      "source_id": "copernicus",
      "source": "Copernicus",
      "source_full": "Copernicus Climate Change Service",
      "category": "Climate",
      "tier": 1
    },
    {
      "title": "NOAA upgrades Global Forecast System with revised convection scheme",
      "summary": "The latest GFS implementation improves tropical cyclone track guidance and precipitation timing, following a multi-season parallel evaluation.",
      "link": "https://www.noaa.gov/",
      "published": "2026-05-30T16:45:00+00:00",
      "source_id": "noaa",
      "source": "NOAA",
      "source_full": "US National Oceanic and Atmospheric Administration",
      "category": "Operations",
      "tier": 1
    },
    {
      "title": "WMO Hydrology: new guidance on transboundary flood forecasting cooperation",
      "summary": "Fresh operational guidance encourages neighbouring services to share real-time gauge data and harmonise warning thresholds along shared river basins to reduce downstream flood impacts.",
      "link": "https://community.wmo.int/",
      "published": "2026-05-29T11:20:00+00:00",
      "source_id": "wmo_water",
      "source": "WMO Hydrology",
      "source_full": "WMO Water & Cryosphere",
      "category": "Water",
      "tier": 2
    },
    {
      "title": "IPCC agrees outline for special report on climate and the cryosphere",
      "summary": "Meeting in plenary, the panel approved the scope and timeline for a new assessment focused on changes in snow, ice and permafrost and their cascading consequences for water security.",
      "link": "https://www.ipcc.ch/",
      "published": "2026-05-28T13:00:00+00:00",
      "source_id": "ipcc",
      "source": "IPCC",
      "source_full": "Intergovernmental Panel on Climate Change",
      "category": "Science",
      "tier": 1
    },
    {
      "title": "Carbon Brief analysis: how AI weather models are reshaping operational forecasting",
      "summary": "A detailed look at the rapid adoption of data-driven forecast systems by national services, the questions they raise about verification and observations, and what it means for the public-private weather enterprise.",
      "link": "https://www.carbonbrief.org/",
      "published": "2026-05-27T10:00:00+00:00",
      "source_id": "carbonbrief",
      "source": "Carbon Brief",
      "source_full": "Carbon Brief",
      "category": "Climate",
      "tier": 2
    }
  ]
};

"use strict";

const SECTOR_COLORS = {
  Governance: "var(--c-governance)",
  Operations: "var(--c-operations)",
  Science: "var(--c-science)",
  Climate: "var(--c-climate)",
  Water: "var(--c-water)",
};

const state = {
  items: [],
  filter: "All",
  query: "",
  generatedAt: null,
};

const els = {
  feed: document.getElementById("feed"),
  filters: document.getElementById("filters"),
  search: document.getElementById("search"),
  empty: document.getElementById("empty"),
  count: document.getElementById("result-count"),
  freshness: document.getElementById("freshness"),
  themeToggle: document.getElementById("theme-toggle"),
};

/* ---------- Theme ---------- */
const savedTheme = localStorage.getItem("metfeed-theme");
if (savedTheme) document.documentElement.dataset.theme = savedTheme;
els.themeToggle.addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  localStorage.setItem("metfeed-theme", next);
});

/* ---------- Helpers ---------- */
function relativeTime(iso) {
  if (!iso) return "";
  const then = new Date(iso);
  if (isNaN(then)) return "";
  const secs = Math.round((Date.now() - then) / 1000);
  const mins = Math.round(secs / 60);
  const hrs = Math.round(mins / 60);
  const days = Math.round(hrs / 24);
  if (secs < 60) return "just now";
  if (mins < 60) return `${mins}m ago`;
  if (hrs < 24) return `${hrs}h ago`;
  if (days < 7) return `${days}d ago`;
  return then.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

function escapeHTML(s) {
  const d = document.createElement("div");
  d.textContent = s ?? "";
  return d.innerHTML;
}

/* ---------- Render ---------- */
function buildFilters() {
  const cats = ["All", ...Array.from(new Set(state.items.map((i) => i.category)))];
  els.filters.innerHTML = cats
    .map(
      (c) =>
        `<button class="chip${c === state.filter ? " active" : ""}" data-cat="${escapeHTML(c)}">${escapeHTML(c)}</button>`
    )
    .join("");
  els.filters.querySelectorAll(".chip").forEach((btn) => {
    btn.addEventListener("click", () => {
      state.filter = btn.dataset.cat;
      buildFilters();
      render();
    });
  });
}

function visibleItems() {
  const q = state.query.trim().toLowerCase();
  return state.items.filter((it) => {
    if (state.filter !== "All" && it.category !== state.filter) return false;
    if (q) {
      const hay = `${it.title} ${it.summary} ${it.source} ${it.source_full}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function cardHTML(it, idx) {
  const color = SECTOR_COLORS[it.category] || "var(--brand)";
  const tier1 = it.tier === 1 ? `<span class="tier1-dot">Official source</span>` : "";
  const link = it.link ? escapeHTML(it.link) : "#";
  return `
    <article class="card" style="--accent-bar:${color}; animation-delay:${Math.min(idx * 35, 350)}ms">
      <div class="card-top">
        <span class="badge" style="background:${color}">${escapeHTML(it.source)}</span>
        <span class="sector-tag">${escapeHTML(it.category)}</span>
        ${tier1}
        <span class="time">${relativeTime(it.published)}</span>
      </div>
      <h2><a href="${link}" target="_blank" rel="noopener">${escapeHTML(it.title)}</a></h2>
      ${it.summary ? `<p class="summary">${escapeHTML(it.summary)}</p>` : ""}
      <div class="card-foot">
        <a class="read-link" href="${link}" target="_blank" rel="noopener">
          Read at ${escapeHTML(it.source_full || it.source)}
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
      </div>
    </article>`;
}

function render() {
  const items = visibleItems();
  els.empty.hidden = items.length > 0;
  els.feed.innerHTML = items.map(cardHTML).join("");
  els.count.textContent = `${items.length} update${items.length === 1 ? "" : "s"}`;
  if (state.generatedAt) {
    els.freshness.textContent = `Updated ${relativeTime(state.generatedAt)}`;
  }
}

function showSkeletons() {
  els.feed.innerHTML = Array.from({ length: 5 }, () => `<div class="skeleton"></div>`).join("");
}

/* ---------- Load ---------- */
function load() {
  state.items = (EMBEDDED_FEED.items) || [];
  state.generatedAt = EMBEDDED_FEED.generated_at || null;
  buildFilters();
  render();
}

els.search.addEventListener("input", (e) => {
  state.query = e.target.value;
  render();
});

load();

</script>
</body>
</html>
