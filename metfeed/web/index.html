<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meteorology Brief · NCM International Affairs</title>
  <meta name="description" content="What's new across the global meteorology sector — WMO, NMHS, climate and water." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.5 19a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.6-1.5A4 4 0 0 0 6 19z" />
            <path d="M8 22l1-2M12 22l1-2M16 22l1-2" />
          </svg>
        </div>
        <div class="brand-text">
          <h1>Meteorology Brief</h1>
          <p>NCM · International Affairs — sector monitor</p>
        </div>
      </div>
      <div class="masthead-actions">
        <div class="search">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="search" type="search" placeholder="Search updates…" autocomplete="off" />
        </div>
        <button id="theme-toggle" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
        </button>
      </div>
    </div>
    <nav class="filters" id="filters" aria-label="Filter by sector"></nav>
  </header>

  <main class="wrap">
    <div class="status-bar">
      <span id="result-count" class="result-count"></span>
      <span id="freshness" class="freshness"></span>
    </div>
    <section id="feed" class="feed" aria-live="polite"></section>
    <div id="empty" class="empty" hidden>
      <p>No updates match your filters.</p>
    </div>
  </main>

  <footer class="foot">
    <p>Aggregated from public RSS feeds of WMO, NMHS and partner bodies · concept build for internal use.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
