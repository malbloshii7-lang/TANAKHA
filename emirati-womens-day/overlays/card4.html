<meta charset="utf-8">
<style>
  @font-face { font-family:'Amiri'; src:url('../fonts/amiri-400.ttf'); font-weight:400; }
  @font-face { font-family:'Amiri'; src:url('../fonts/amiri-700.ttf'); font-weight:700; }
  @font-face { font-family:'Cairo'; src:url('../fonts/cairo-400.ttf'); font-weight:400; }
  @font-face { font-family:'Cairo'; src:url('../fonts/cairo-700.ttf'); font-weight:700; }
  @font-face { font-family:'Montserrat'; src:url('../fonts/mont-400.ttf'); font-weight:400; }
  @font-face { font-family:'Montserrat'; src:url('../fonts/mont-600.ttf'); font-weight:600; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1280px; height:720px; background:transparent; overflow:hidden; }
  .frame { position:relative; width:1280px; height:720px; }
  .scrim-center { position:absolute; inset:0;
    background:radial-gradient(ellipse 75% 60% at 50% 52%, rgba(10,14,20,.52) 0%, rgba(10,14,20,.28) 55%, rgba(10,14,20,0) 100%); }
  .scrim-lower { position:absolute; left:0; right:0; bottom:0; height:46%;
    background:linear-gradient(to top, rgba(8,12,18,.62) 0%, rgba(8,12,18,.38) 55%, rgba(8,12,18,0) 100%); }
  .center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .lower { position:absolute; left:0; right:0; bottom:44px; display:flex; flex-direction:column; align-items:center; text-align:center; }
  .ar-big  { font-family:'Amiri'; font-weight:700; color:#fff; font-size:76px; line-height:1.25; direction:rtl;
             text-shadow:0 2px 18px rgba(0,0,0,.55); }
  .ar-mid  { font-family:'Amiri'; font-weight:700; color:#fff; font-size:46px; line-height:1.45; direction:rtl;
             text-shadow:0 2px 14px rgba(0,0,0,.6); max-width:1080px; }
  .rule { width:120px; height:2px; margin:18px auto 16px;
          background:linear-gradient(90deg, rgba(200,162,75,0), #C8A24B 20%, #E8CF8F 50%, #C8A24B 80%, rgba(200,162,75,0)); }
  .en   { font-family:'Montserrat'; font-weight:600; color:#F3EBDD; font-size:26px; letter-spacing:.32em; text-transform:uppercase;
          text-shadow:0 2px 12px rgba(0,0,0,.6); padding-left:.32em; }
  .en-sub { font-family:'Montserrat'; font-weight:400; color:#EDE6DA; font-size:23px; letter-spacing:.02em;
            text-shadow:0 2px 12px rgba(0,0,0,.65); max-width:980px; line-height:1.5; }
  .date { font-family:'Montserrat'; font-weight:400; color:#D9C48A; font-size:20px; letter-spacing:.24em; margin-top:20px;
          text-shadow:0 2px 10px rgba(0,0,0,.6); padding-left:.24em; }
  .sig-name { font-family:'Montserrat'; font-weight:600; color:#fff; font-size:30px; letter-spacing:.06em; margin-top:6px;
              text-shadow:0 2px 12px rgba(0,0,0,.6); }
  .sig-ar { font-family:'Amiri'; font-weight:700; color:#fff; font-size:34px; direction:rtl; margin-top:2px;
            text-shadow:0 2px 12px rgba(0,0,0,.6); }
  .sig-title { font-family:'Montserrat'; font-weight:400; color:#E4D9C4; font-size:18px; letter-spacing:.05em; line-height:1.6; margin-top:8px;
               text-shadow:0 2px 10px rgba(0,0,0,.65); }
  .sig-title-ar { font-family:'Cairo'; font-weight:400; color:#E4D9C4; font-size:19px; direction:rtl; line-height:1.7; margin-top:2px;
                  text-shadow:0 2px 10px rgba(0,0,0,.65); }
</style>
<body>
<div class="frame"><div class="scrim-center"></div><div class="center">
  <div class="ar-mid" style="font-size:56px">كل عام والمرأة الإماراتية بخير</div>
  <div class="rule"></div>
  <div class="sig-ar">د. عبدالله المندوس</div>
  <div class="sig-name">Dr. Abdulla Al Mandous</div>
  <div class="sig-title-ar">رئيس المنظمة العالمية للأرصاد الجوية &middot; المدير العام للمركز الوطني للأرصاد</div>
  <div class="sig-title">President, World Meteorological Organization &middot; Director General, National Center of Meteorology</div>
</div></div>
</body>
