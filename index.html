<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Watchlist</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 60px 24px;
    font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(120% 90% at 50% 0%, #0a0f18 0%, #05070d 55%, #03040a 100%);
    color: #e8f0f5;
    -webkit-font-smoothing: antialiased;
  }

  .panel {
    width: min(420px, 100%);
    border-radius: 20px;
    border: 1px solid rgba(120, 150, 170, 0.14);
    background: linear-gradient(180deg, rgba(18, 26, 38, 0.55) 0%, rgba(8, 12, 20, 0.4) 100%);
    box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5);
    overflow: hidden;
  }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 24px;
    border-bottom: 1px solid rgba(120, 150, 170, 0.14);
  }

  .panel-header .title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: #f4f8fb;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #34d9b0;
    box-shadow: 0 0 10px rgba(52, 217, 176, 0.7);
  }

  .panel-header .count {
    font-size: 13px;
    color: #6b7686;
  }

  .rows { display: flex; flex-direction: column; }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 24px;
    border-bottom: 1px solid rgba(120, 150, 170, 0.1);
  }

  .row:last-child { border-bottom: none; }

  .row .symbol {
    font-size: 16px;
    font-weight: 700;
    color: #f4f8fb;
  }

  .row .price {
    font-family: "Consolas", "Courier New", monospace;
    font-size: 16px;
    color: #cdd6e0;
  }

  .row .change {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: "Consolas", "Courier New", monospace;
    font-size: 15px;
    font-weight: 700;
  }

  .row .change.up { color: #5fe6a2; }
  .row .change.down { color: #ff6b60; }

  .row .change .arrow { font-size: 0.75em; }
</style>
</head>
<body>
  <div class="panel">
    <div class="panel-header">
      <div class="title"><span class="dot"></span>WATCHLIST</div>
      <div class="count" id="asset-count"></div>
    </div>
    <div class="rows" id="rows"></div>
  </div>

  <script>
    var assets = [
      { symbol: "BTC/USDT", price: 63263, change: 2.4 },
      { symbol: "ETH/USDT", price: 3412, change: 1.1 },
      { symbol: "SOL/USDT", price: 146.80, change: -3.2 },
      { symbol: "GOLD",     price: 2385.50, change: 0.6 },
      { symbol: "SP500",    price: 5487.30, change: -0.4 }
    ];

    function formatPrice(value) {
      var parts = value.toFixed(value < 100 ? 2 : (value < 1000 ? 2 : 0)).toString().split(".");
      parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      return parts.join(".");
    }

    var rowsEl = document.getElementById("rows");
    var countEl = document.getElementById("asset-count");
    countEl.textContent = assets.length + " assets";

    assets.forEach(function (asset) {
      var isUp = asset.change >= 0;
      var row = document.createElement("div");
      row.className = "row";
      row.innerHTML =
        '<div class="symbol">' + asset.symbol + '</div>' +
        '<div class="price">' + formatPrice(asset.price) + '</div>' +
        '<div class="change ' + (isUp ? "up" : "down") + '">' +
          '<span class="arrow">' + (isUp ? "&#9650;" : "&#9660;") + '</span>' +
          '<span>' + Math.abs(asset.change).toFixed(1) + '%</span>' +
        '</div>';
      rowsEl.appendChild(row);
    });
  </script>
</body>
</html>
