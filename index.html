<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BTC/USDT Market Status Card</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background:
      radial-gradient(120% 90% at 50% 20%, #0b1526 0%, #070c16 45%, #03060c 100%),
      #03060c;
    color: #e8f0f5;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    position: relative;
    width: min(760px, 100%);
    aspect-ratio: 4 / 3;
    max-height: 88vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 48px;
    border-radius: 40px;
    border: 1px solid rgba(84, 200, 214, 0.22);
    background:
      radial-gradient(140% 120% at 50% 0%, rgba(20, 38, 54, 0.55) 0%, rgba(8, 15, 26, 0.35) 55%, rgba(4, 8, 15, 0.2) 100%);
    box-shadow:
      0 0 0 1px rgba(84, 200, 214, 0.05),
      0 40px 120px rgba(0, 0, 0, 0.55);
  }

  .symbol {
    font-size: clamp(28px, 5vw, 46px);
    font-weight: 700;
    letter-spacing: 0.14em;
    color: #6fd6e2;
    margin-bottom: 18px;
  }

  .price {
    font-size: clamp(84px, 17vw, 180px);
    font-weight: 800;
    line-height: 0.95;
    letter-spacing: 0.01em;
    color: #f4f8fb;
    text-shadow: 0 6px 40px rgba(0, 0, 0, 0.4);
  }

  .change {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 26px;
    font-size: clamp(26px, 4.5vw, 44px);
    font-weight: 700;
    letter-spacing: 0.04em;
    color: #5fe6a2;
  }

  .change .arrow {
    font-size: 0.72em;
    line-height: 1;
  }

  .pill {
    margin-top: 42px;
    padding: 18px 56px;
    border-radius: 999px;
    border: 1px solid rgba(84, 200, 214, 0.55);
    background: rgba(30, 70, 82, 0.28);
    color: #7fdfe9;
    font-size: clamp(18px, 2.6vw, 26px);
    font-weight: 700;
    letter-spacing: 0.22em;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="symbol">BTC/USDT</div>
    <div class="price">63,263</div>
    <div class="change"><span class="arrow">&#9650;</span><span>+2.4%</span></div>
    <div class="pill">BULLISH</div>
  </div>
</body>
</html>
